openapi: 3.1.0
info:
  title: BioCrete Atlas API
  version: 0.1.0
  description: |
    Recetas de concreto autorreparable por zona costera (Perú, ampliable a otros países), predicción
    del cierre de fisuras con el conjunto de modelos entrenado con los datos de Blur y recepción de
    ensayos de terceros que alimentan el siguiente re-entrenamiento (`python -m atlas sync`).
    Las predicciones son estimaciones con intervalo de confianza, no certificaciones de diseño.
paths:
  /api/salud:
    get: {summary: Estado del servicio, responses: {"200": {description: ok}}}
  /api/modelo/version:
    get: {summary: Versión del modelo, métricas de validación agrupada y metadatos, responses: {"200": {description: ok}}}
  /api/zonas:
    get:
      summary: GeoJSON ligero de todas las zonas (sin el detalle de recetas)
      responses: {"200": {description: FeatureCollection}}
  /api/zonas/{id}:
    get:
      summary: Zona completa (clima, niebla, deposición de cloruros, reglas, recetas)
      parameters: [{name: id, in: path, required: true, schema: {type: string, example: PER-012-0}}]
      responses: {"200": {description: Feature}, "404": {description: no existe}}
  /api/zonas/{id}/recomendacion:
    get:
      summary: Recetas recomendadas (ideal, economica, disponible) y la referencia sin agente
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: tipo, in: query, schema: {type: string, enum: [ideal, economica, disponible]}}
      responses: {"200": {description: recetas}}
  /api/predecir:
    post:
      summary: Cierre de fisura predicho para una mezcla/ensayo libre
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [w0_mm, edad_dias, portador]
              properties:
                w0_mm: {type: number, example: 0.3}
                edad_dias: {type: number, example: 90}
                portador: {type: string, enum: [ninguno, cristalino, Basilisk, LWA, hidrogel, CNC]}
                tiene_bacterias: {type: boolean}
                nutriente: {type: string, example: lactato}
                ambiente_marino: {type: boolean}
                curado_previo: {type: boolean}
      responses: {"200": {description: "cierre_pct, IC 95 %, avisos de extrapolación"}, "429": {description: límite de solicitudes}}
  /api/aportes:
    post:
      summary: Enviar ensayos (JSON con lista de filas o text/csv con la plantilla atlas/aportes/plantilla_aportes_atlas.csv)
      parameters: [{name: X-API-Key, in: header, required: true, schema: {type: string}}]
      responses: {"200": {description: "filas aceptadas y rechazadas con motivo"}, "401": {description: clave inválida}}
  /api/aportes/archivos:
    get:
      summary: Lista de CSV pendientes de sincronizar (requiere ATLAS_ADMIN_KEY)
      parameters: [{name: X-API-Key, in: header, required: true, schema: {type: string}}]
      responses: {"200": {description: ok}}
