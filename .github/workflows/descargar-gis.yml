# Descarga capas GIS que no son accesibles desde la nube de desarrollo (INGEMMET, MINAM, INEI, OSM)
# y las guarda en atlas/datos/gis/ en la misma rama.
name: descargar-gis
on:
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes separadas por espacio (vacío = todas): ingemmet minam osm"
        default: ""
  push:
    paths:
      - "atlas/descargar_gis.py"
      - ".github/workflows/descargar-gis.yml"

permissions:
  contents: write

concurrency:
  group: descargar-gis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar
        run: |
          if [ -n "${{ inputs.fuentes }}" ]; then python atlas/descargar_gis.py --solo ${{ inputs.fuentes }}; else python atlas/descargar_gis.py; fi
      - name: Resumen
        if: always()
        run: |
          test -f atlas/datos/gis/registro.json && python -c "import json;r=json.load(open('atlas/datos/gis/registro.json'));[print(k, v.get('estado'), v.get('elementos', v.get('detalle',''))) for k,v in r.items() if isinstance(v,dict)]" | tee -a $GITHUB_STEP_SUMMARY || true
      - name: Guardar en la rama
        run: |
          git config user.name "atlas-descargas"
          git config user.email "atlas-descargas@users.noreply.github.com"
          git add atlas/datos/gis
          git diff --cached --quiet || git commit -m "data(atlas): capas GIS descargadas por descargar-gis"
          git push
