# Re-entrena el BioCrete Atlas cada vez que Blur recibe datos nuevos y regenera el mapa.
name: atlas-sync
on:
  push:
    paths:
      - "biocrete_neat/datos/**"
      - "datasets_reales_zenodo/**"
      - "atlas/catalogo/**"
      - "atlas/datos/**"
      - "atlas/fuentes.yaml"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Re-entrenar aunque no haya fuentes nuevas"
        type: boolean
        default: false
      territorio:
        description: "Recalcular relieve (DEM), población (WorldPop) y clima (tras cambiar la malla)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atlas-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r biocrete_neat/requirements.txt -r atlas/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias web (la prueba de paridad Fick compila web/src/fick.ts)
        run: cd web && npm ci
      - name: Pruebas
        run: python -m pytest -q atlas/tests biocrete_neat/tests
      - name: Territorio (relieve, población y clima; solo si se pide)
        if: ${{ inputs.territorio }}
        run: python -m atlas territorio
      - name: Clima de celdas nuevas (solo descarga lo que falta)
        run: python -m atlas.ambiente
      - name: Sincronizar (ingesta → entrenar → recetas)
        run: python -m atlas sync ${{ inputs.forzar && '--forzar' || '' }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Paridad Go ↔ Python
        run: cd api && go test ./...
      - name: Compilar el mapa
        run: cd web && npm run build && npm run artefacto
      - name: Guardar resultados
        run: |
          git config user.name "atlas-sync"
          git config user.email "atlas-sync@users.noreply.github.com"
          git add atlas/modelos atlas/salida atlas/datos atlas/tests/fixture_paridad.json
          git diff --cached --quiet || git commit -m "chore(atlas): re-entrenamiento automático con datos nuevos de Blur"
          git push
