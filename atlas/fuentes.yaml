# Contrato de datos del Atlas: qué fuentes de Blur se leen y cómo se mapean al esquema unificado.
# Para sumar una fuente nueva (p. ej. un dataset que descargue buscar_datasets.py o los ensayos
# de Paita) basta con añadir una entrada aquí: `atlas ingest` la detecta por su huella.
#
# tipo: replicas_cierre  → filas con w0, edad y cierre % (entrenan el modelo de cierre)
#       territorio       → clima, relieve, población, geografía y capas GIS que recoge Blur
#                          (python -m biocrete_neat.territorio); no entrenan: recalculan las zonas
#       cloruros_rcm     → D_RCM vs a/c (calibran el modelo de difusión)
#       cloruros_agno3   → penetración de cloruros con/sin agente (efecto del agente)
#       referencia       → se registran para trazabilidad pero no entrenan
#
# Comodines: `ruta` admite `*` y `**`. Cada archivo que coincida es una fuente aparte. Úsalos para las
# carpetas donde los agentes de Blur dejan datasets nuevos; basta con respetar las columnas mapeadas.
# Esquema mínimo de una réplica de cierre: w0_mm, edad_dias, cierre_pct (0-100), portador
# (ninguno|cristalino|Basilisk|LWA|hidrogel|CNC), tiene_bacterias (0/1), nutriente, ambiente_marino (0/1),
# regimen (curado_previo|exposicion_directa|vacío), grupo_probeta (id de fisura/probeta), fuente.
fuentes:
  - id: replicas_blur
    ruta: biocrete_neat/datos/replicas_cierre_fisuras.csv
    tipo: replicas_cierre
    entrena: true
    columnas:            # esquema_atlas: columna_origen
      w0_mm: w0_mm
      edad_dias: edad_dias
      cierre_pct: cierre_pct
      portador: portador
      tiene_bacterias: tiene_bacterias
      nutriente: nutriente
      ambiente_marino: ambiente_marino
      regimen: regimen
      grupo: grupo_probeta
      fuente: fuente
  - id: aportes_validados
    ruta: biocrete_neat/datos/aportes_validados.csv
    tipo: replicas_cierre
    entrena: true
    columnas:
      w0_mm: w0_mm
      edad_dias: edad_dias
      cierre_pct: cierre_pct
      portador: portador
      tiene_bacterias: tiene_bacterias
      nutriente: nutriente
      ambiente_marino: ambiente_marino
      regimen: regimen
      grupo: grupo_probeta
      fuente: fuente
  - id: replicas_agentes
    ruta: biocrete_neat/datos/replicas/**/*.csv     # datasets nuevos de los agentes de Blur (vía PR)
    tipo: replicas_cierre
    entrena: true
    columnas:
      w0_mm: w0_mm
      edad_dias: edad_dias
      cierre_pct: cierre_pct
      portador: portador
      tiene_bacterias: tiene_bacterias
      nutriente: nutriente
      ambiente_marino: ambiente_marino
      regimen: regimen
      grupo: grupo_probeta
      fuente: fuente
  - id: dryad_rcm
    ruta: biocrete_neat/datos/dryad_opc_drcm_real.csv
    tipo: cloruros_rcm
    entrena: true
    columnas:
      a_c: a_c
      d_rcm_1e12: d_rcm_exp_1e12
  - id: cappellesso_agno3
    ruta: biocrete_neat/datos/cappellesso2024_agno3_marino.csv
    tipo: cloruros_agno3
    entrena: true
    columnas:
      condicion: condicion
      grupo: grupo
      penetracion_mm: penetracion_cl_media_mm
  - id: meta_v2
    ruta: biocrete_neat/datos/literatura/meta_dataset_cab_v2.csv
    tipo: referencia
    entrena: false
  - id: literatura_extraida
    ruta: biocrete_neat/datos/literatura/literatura_extraida.csv
    tipo: referencia
    entrena: false
  - id: zenodo
    ruta: datasets_reales_zenodo
    tipo: referencia
    entrena: false
  # ---- territorio: lo recoge Blur (biocrete_neat/territorio), el Atlas solo lo lee ----
  - id: territorio_geo
    ruta: biocrete_neat/datos/territorio/geo/*
    tipo: territorio
    entrena: false
  - id: territorio_clima
    ruta: biocrete_neat/datos/territorio/clima_era5_*.json
    tipo: territorio
    entrena: false
  - id: territorio_registro          # relieve (DEM) y población (WorldPop): sus huellas están en el registro
    ruta: biocrete_neat/datos/territorio/registro.json
    tipo: territorio
    entrena: false
  - id: territorio_gis
    ruta: biocrete_neat/datos/territorio/gis/**/*.geojson
    tipo: territorio
    entrena: false
