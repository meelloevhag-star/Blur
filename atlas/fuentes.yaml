# Contrato de datos del Atlas: qué fuentes de Blur se leen y cómo se mapean al esquema unificado.
# Para sumar una fuente nueva (p. ej. un dataset que descargue buscar_datasets.py o los ensayos
# de Paita) basta con añadir una entrada aquí: `atlas ingest` la detecta por su huella.
#
# tipo: replicas_cierre  → filas con w0, edad y cierre % (entrenan el modelo de cierre)
#       cloruros_rcm     → D_RCM vs a/c (calibran el modelo de difusión)
#       cloruros_agno3   → penetración de cloruros con/sin agente (efecto del agente)
#       referencia       → se registran para trazabilidad pero no entrenan
fuentes:
  - id: replicas_blur
    ruta: biocrete_neat/datos/replicas_cierre_fisuras.csv
    tipo: replicas_cierre
    entrena: true
    columnas:            # esquema_atlas: columna_origen
      w0_mm: w0_mm
      edad_dias: edad_dias
      cierre_pct: cierre_pct
      portador: portador
      tiene_bacterias: tiene_bacterias
      nutriente: nutriente
      ambiente_marino: ambiente_marino
      regimen: regimen
      grupo: grupo_probeta
      fuente: fuente
  - id: aportes_validados
    ruta: biocrete_neat/datos/aportes_validados.csv
    tipo: replicas_cierre
    entrena: true
    columnas:
      w0_mm: w0_mm
      edad_dias: edad_dias
      cierre_pct: cierre_pct
      portador: portador
      tiene_bacterias: tiene_bacterias
      nutriente: nutriente
      ambiente_marino: ambiente_marino
      regimen: regimen
      grupo: grupo_probeta
      fuente: fuente
  - id: dryad_rcm
    ruta: biocrete_neat/datos/dryad_opc_drcm_real.csv
    tipo: cloruros_rcm
    entrena: true
    columnas:
      a_c: a_c
      d_rcm_1e12: d_rcm_exp_1e12
  - id: cappellesso_agno3
    ruta: biocrete_neat/datos/cappellesso2024_agno3_marino.csv
    tipo: cloruros_agno3
    entrena: true
    columnas:
      condicion: condicion
      grupo: grupo
      penetracion_mm: penetracion_cl_media_mm
  - id: meta_v2
    ruta: biocrete_neat/datos/literatura/meta_dataset_cab_v2.csv
    tipo: referencia
    entrena: false
  - id: literatura_extraida
    ruta: biocrete_neat/datos/literatura/literatura_extraida.csv
    tipo: referencia
    entrena: false
  - id: zenodo
    ruta: datasets_reales_zenodo
    tipo: referencia
    entrena: false
